services:
  user-db:
    image: postgres:16-alpine
    container_name: petcare-user-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: petcare_users
      POSTGRES_USER: petcare_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - user_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petcare_user -d petcare_users"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  user_db_data: