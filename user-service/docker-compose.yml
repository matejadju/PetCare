services:

  user-db:
    image: postgres:16-alpine
    container_name: petcare-user-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: petcare_users
      POSTGRES_USER: petcare_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - user_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petcare_user -d petcare_users"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - user-db-network

  user-service:
    build:
      context: .
      dockerfile: Dockerfile

    image: petcare-user-service:1.0.0
    container_name: petcare-user-service
    restart: unless-stopped

    ports:
      - "8001:8001"

    environment:
      PORT: 8001
      NODE_ENV: production

      DATABASE_URL: "postgresql://petcare_user:${POSTGRES_PASSWORD}@user-db:5432/petcare_users?schema=public"

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-petcare-user-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-petcare-api}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}

      APPOINTMENT_SERVICE_URL: http://appointment-service:8004
      APPOINTMENT_SERVICE_TIMEOUT_MS: 5000

    depends_on:
      user-db:
        condition: service_healthy

    command:
      - sh
      - -c
      - npx prisma migrate deploy && exec node src/server.js

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - petcare-network
      - user-db-network

volumes:
  user_db_data:

networks:
  petcare-network:
    external: true

  user-db-network:
    driver: bridge