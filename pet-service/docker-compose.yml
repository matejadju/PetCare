services:

  pet-db:
    image: postgres:16-alpine
    container_name: petcare-pet-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: petcare_pets
      POSTGRES_USER: petcare_pet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - pet_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petcare_pet -d petcare_pets"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - pet-db-network

  pet-service:
    build:
      context: .
      dockerfile: Dockerfile

    image: petcare-pet-service:1.0.0
    container_name: petcare-pet-service
    restart: unless-stopped

    ports:
      - "8002:8002"

    environment:
      PORT: 8002
      NODE_ENV: production

      DATABASE_URL: "postgresql://petcare_pet:${POSTGRES_PASSWORD}@pet-db:5432/petcare_pets?schema=public"

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-petcare-user-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-petcare-api}

      USER_SERVICE_URL: http://user-service:8001
      APPOINTMENT_SERVICE_URL: http://appointment-service:8004
      APPOINTMENT_SERVICE_TIMEOUT_MS: 5000

    depends_on:
      pet-db:
        condition: service_healthy

    command:
      - sh
      - -c
      - npx prisma migrate deploy && exec node src/server.js

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - petcare-network
      - pet-db-network

volumes:
  pet_db_data:

networks:
  petcare-network:
    external: true

  pet-db-network:
    driver: bridge