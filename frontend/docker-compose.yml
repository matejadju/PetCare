services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api

    container_name: petcare-frontend

    restart: unless-stopped

    ports:
      - "127.0.0.1:5173:80"

    networks:
      - petcare-network

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  petcare-network:
    external: true